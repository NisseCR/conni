<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio Mixer MVP</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script defer src="/static/js/app.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Now Playing</h2>

        <div class="panel">
          <div class="panel-label">Playlist</div>
          <div id="current-playlist" class="panel-value">None</div>

          <div class="panel-label">Music Volume</div>
          <input id="music-volume" type="range" min="0" max="1" step="0.01" value="1">

          <div class="panel-label">Master Volume</div>
          <input id="master-volume" type="range" min="0" max="1" step="0.01" value="1">
        </div>

        <h2>Active Ambience</h2>
        <div id="active-ambience" class="sidebar-list"></div>
      </aside>

      <main class="content">
        <div class="section">
          <h1>Audio Mixer MVP</h1>
          <div id="state" class="state-box">Loading...</div>
        </div>

        <div class="section">
          <h2>Playlists</h2>
          <div id="playlists" class="grid"></div>
        </div>

        <div class="section">
          <h2>Ambience</h2>
          <div id="ambience" class="grid"></div>
        </div>
      </main>
    </div>
  </body>
</html>
